    </defs><rect width="1200" height="680" fill="#F0EBE0"/><text x="600" y="72" text-anchor="middle" font-family="'New York','Iowan Old Style',Georgia,'Times New Roman',serif" font-size="40" fill="#1A1A1A">Let the week <tspan font-style="italic" fill="#1F3D32">happen</tspan></text><text x="600" y="110" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="19" fill="#5C5C5C">Outcomes gather all week. One tune-up on Monday, one PR to read.</text><line x1="555" y1="138" x2="645" y2="138" stroke="#1F3D32" stroke-width="0.8"/><line x1="150" y1="268" x2="1010" y2="268" stroke="#A8BFA9" stroke-width="1.0"/><circle cx="180" cy="252" r="3.2" fill="#1F3D32"/><text x="180" y="290" text-anchor="middle" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" letter-spacing="1" fill="#5C5C5C">MON</text><circle cx="315" cy="252" r="3.2" fill="#1F3D32"/><circle cx="315" cy="240" r="3.2" fill="#1F3D32"/><text x="315" y="290" text-anchor="middle" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" letter-spacing="1" fill="#5C5C5C">TUE</text><circle cx="450" cy="252" r="3.2" fill="#1F3D32"/><circle cx="450" cy="240" r="3.2" fill="#1F3D32"/><text x="450" y="290" text-anchor="middle" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" letter-spacing="1" fill="#5C5C5C">WED</text><circle cx="585" cy="252" r="3.2" fill="#1F3D32"/><circle cx="585" cy="240" r="3.2" fill="#1F3D32"/><circle cx="585" cy="228" r="3.2" fill="#1F3D32"/><text x="585" y="290" text-anchor="middle" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" letter-spacing="1" fill="#5C5C5C">THU</text><circle cx="720" cy="252" r="3.2" fill="#1F3D32"/><circle cx="720" cy="240" r="3.2" fill="#1F3D32"/><circle cx="720" cy="228" r="3.2" fill="#1F3D32"/><circle cx="720" cy="216" r="3.2" fill="#1F3D32"/><text x="720" y="290" text-anchor="middle" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" letter-spacing="1" fill="#5C5C5C">FRI</text><circle cx="855" cy="252" r="3.2" fill="#1F3D32"/><circle cx="855" cy="240" r="3.2" fill="#1F3D32"/><circle cx="855" cy="228" r="3.2" fill="#1F3D32"/><circle cx="855" cy="216" r="3.2" fill="#1F3D32"/><text x="855" y="290" text-anchor="middle" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" letter-spacing="1" fill="#5C5C5C">SAT</text><circle cx="985" cy="252" r="3.2" fill="#1F3D32"/><circle cx="985" cy="240" r="3.2" fill="#1F3D32"/><circle cx="985" cy="228" r="3.2" fill="#1F3D32"/><circle cx="985" cy="216" r="3.2" fill="#1F3D32"/><circle cx="985" cy="204" r="3.2" fill="#1F3D32"/><text x="985" y="290" text-anchor="middle" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" letter-spacing="1" fill="#5C5C5C">SUN</text><text x="150" y="176" text-anchor="start" font-family="Georgia,serif" font-size="15" font-weight="400" letter-spacing="0" fill="#5C5C5C" font-style="italic">outcomes accumulate</text><rect x="110" y="430" width="210" height="62" rx="6" fill="#F0EBE0" stroke="#1F3D32" stroke-width="1.2"/><text x="215.0" y="468" text-anchor="middle" font-family="Georgia,serif" font-size="17" font-weight="400" letter-spacing="0" fill="#1F3D32" font-style="italic">MON · 08:00</text><rect x="360" y="430" width="210" height="62" rx="6" fill="#F7F4EC" stroke="#A8BFA9" stroke-width="1.0"/><text x="465.0" y="468" text-anchor="middle" font-family="Georgia,serif" font-size="17" font-weight="400" letter-spacing="0" fill="#1A1A1A" font-style="italic">run the tune</text><rect x="615" y="430" width="210" height="62" rx="6" fill="#F7F4EC" stroke="#A8BFA9" stroke-width="1.0"/><text x="720.0" y="468" text-anchor="middle" font-family="Georgia,serif" font-size="17" font-weight="400" letter-spacing="0" fill="#1A1A1A" font-style="italic">one PR, small diff</text><rect x="870" y="430" width="210" height="62" rx="6" fill="#F0EBE0" stroke="#1F3D32" stroke-width="1.2"/><text x="975.0" y="468" text-anchor="middle" font-family="Georgia,serif" font-size="17" font-weight="400" letter-spacing="0" fill="#1F3D32" font-style="italic">you merge or close</text><line x1="324" y1="461" x2="356" y2="461" stroke="#1F3D32" stroke-width="1.3" marker-end="url(#ah)"/><line x1="574" y1="461" x2="611" y2="461" stroke="#1F3D32" stroke-width="1.3" marker-end="url(#ah)"/><line x1="829" y1="461" x2="866" y2="461" stroke="#1F3D32" stroke-width="1.3" marker-end="url(#ah)"/><path d="M 580 300 C 400 360, 260 372, 215 428" fill="none" stroke="#A8BFA9" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#ahg)"/><text x="600" y="560" text-anchor="middle" font-family="Georgia,serif" font-size="17" font-weight="400" letter-spacing="0" fill="#5C5C5C" font-style="italic">Do not tune after every reply. That is how a system overfits to one loud account.</text><text x="60" y="630" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="500" letter-spacing="3" fill="#5C5C5C">STEP 8 · CADENCE</text><text x="1140" y="630" text-anchor="end" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="500" letter-spacing="3" fill="#1F3D32">SORTLIST · @NIFINET</text></svg>