    </defs><rect width="1200" height="700" fill="#F0EBE0"/><text x="600" y="72" text-anchor="middle" font-family="'New York','Iowan Old Style',Georgia,'Times New Roman',serif" font-size="40" fill="#1A1A1A">Codex proposes. A human <tspan font-style="italic" fill="#1F3D32">merges</tspan></text><text x="600" y="110" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="19" fill="#5C5C5C">Tedious work goes to the machine. Merging stays a human call.</text><line x1="555" y1="138" x2="645" y2="138" stroke="#1F3D32" stroke-width="0.8"/><rect x="70" y="290" width="250" height="155" rx="6" fill="#F7F4EC" stroke="#A8BFA9" stroke-width="1.0"/><text x="95" y="326" text-anchor="start" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="2" fill="#1F3D32">CODEX</text><text x="95" y="360" text-anchor="start" font-family="Georgia,serif" font-size="14" font-weight="400" letter-spacing="0" fill="#1A1A1A">reads the outcomes</text><text x="95" y="384" text-anchor="start" font-family="Georgia,serif" font-size="14" font-weight="400" letter-spacing="0" fill="#1A1A1A">edits one file</text><text x="95" y="408" text-anchor="start" font-family="Georgia,serif" font-size="14" font-weight="400" letter-spacing="0" fill="#1A1A1A">runs the eval</text><text x="95" y="432" text-anchor="start" font-family="Georgia,serif" font-size="14" font-weight="400" letter-spacing="0" fill="#1A1A1A">writes the PR summary</text><line x1="320" y1="367" x2="376" y2="367" stroke="#1F3D32" stroke-width="1.3" marker-end="url(#ah)"/><rect x="381" y="268" width="360" height="200" rx="6" fill="#F0EBE0" stroke="#1F3D32" stroke-width="1.3"/><text x="561" y="305" text-anchor="middle" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" letter-spacing="2" fill="#1F3D32">PULL REQUEST</text><text x="411" y="345" text-anchor="start" font-family="Georgia,serif" font-size="15" font-weight="400" letter-spacing="0" fill="#1A1A1A">what changed</text><text x="411" y="375" text-anchor="start" font-family="Georgia,serif" font-size="15" font-weight="400" letter-spacing="0" fill="#1A1A1A">why · cites the outcome rows</text><text x="411" y="405" text-anchor="start" font-family="Georgia,serif" font-size="15" font-weight="400" letter-spacing="0" fill="#1A1A1A">before 0.75 · after 1.00</text><text x="411" y="435" text-anchor="start" font-family="Georgia,serif" font-size="15" font-weight="400" letter-spacing="0" fill="#1A1A1A">risk + what to check</text><line x1="741" y1="367" x2="797" y2="367" stroke="#1F3D32" stroke-width="1.3" marker-end="url(#ah)"/><rect x="802" y="290" width="250" height="155" rx="6" fill="#F7F4EC" stroke="#A8BFA9" stroke-width="1.0"/><text x="827" y="326" text-anchor="start" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="2" fill="#1F3D32">THE HUMAN</text><text x="827" y="362" text-anchor="start" font-family="Georgia,serif" font-size="15" font-weight="400" letter-spacing="0" fill="#1A1A1A">reads the diff</text><text x="827" y="388" text-anchor="start" font-family="Georgia,serif" font-size="15" font-weight="400" letter-spacing="0" fill="#1A1A1A">merges, edits,</text><text x="827" y="414" text-anchor="start" font-family="Georgia,serif" font-size="15" font-weight="400" letter-spacing="0" fill="#1A1A1A">or closes</text><line x1="927" y1="447" x2="927" y2="486" stroke="#1F3D32" stroke-width="1.3" marker-end="url(#ah)"/><rect x="802" y="488" width="250" height="50" rx="6" fill="#F0EBE0" stroke="#1F3D32" stroke-width="1.2"/><text x="927" y="519" text-anchor="middle" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" letter-spacing="1" fill="#1F3D32">MERGED = LIVE</text><text x="600" y="595" text-anchor="middle" font-family="Georgia,serif" font-size="17" font-weight="400" letter-spacing="0" fill="#1A1A1A" font-style="italic">Sending and merging stay outside the loop. That minute is the whole safety system.</text><text x="60" y="655" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="500" letter-spacing="3" fill="#5C5C5C">STEP 7 · SHIP</text><text x="1140" y="655" text-anchor="end" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="500" letter-spacing="3" fill="#1F3D32">SORTLIST · @NIFINET</text></svg>